name: CodeQL

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]
  schedule:
    - cron: "30 5 * * 1"
  merge_group:

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    name: CodeQL
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Inicializar CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: python

      - name: Analizar
        uses: github/codeql-action/analyze@v4
